      return num.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

    function App() {
      const [recipes, setRecipes] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {}
        return INITIAL_OFFICIAL_RECIPES;
      });

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(recipes));
        } catch (e) {}
      }, [recipes]);

      const currentRecipe = useMemo(() => {
        return recipes.find(r => r.id === selectedRecipeId) || recipes[0];
      }, [recipes, selectedRecipeId]);

      const officialRecipes = useMemo(() => recipes.filter(r => r.official), [recipes]);
      const myRecipes = useMemo(() => recipes.filter(r => !r.official), [recipes]);

      const pricing = useMemo(() => {
        if (!currentRecipe) return { ingTotal: 0, costPerTray: 0, price: 0, profit: 0, err: false };

        const ingTotal = (currentRecipe.ingredients || []).reduce((acc, ing) => {
          return acc + (Number(ing.qty) || 0) * (Number(ing.price) || 0);
        }, 0);

        const trays = Math.max(1, Number(currentRecipe.yieldTrays) || 1);
        const labor = Number(currentRecipe.labor) || 0;
        const other = Number(currentRecipe.other) || 0;
        const packaging = Number(currentRecipe.packaging) || 0;
        const fixedFee = Number(currentRecipe.fixedFee) || 0;
        
        const costPerTray = ((ingTotal + labor + other) / trays) + packaging + fixedFee;
        const feePercent = (Number(currentRecipe.fee) || 0) / 100;
        const marginPercent = (Number(currentRecipe.margin) || 0) / 100;
        
        const denominator = 1 - feePercent - marginPercent;
        if (denominator <= 0) return { ingTotal, costPerTray, price: 0, profit: 0, err: true };

        const price = costPerTray / denominator;
        const profit = price - costPerTray - (price * feePercent);

        return { ingTotal, costPerTray, price, profit, err: false };
      }, [currentRecipe]);

      const handleUpdateRecipeField = (field, value) => {
        setRecipes(prev => prev.map(r => r.id === selectedRecipeId ? { ...r, [field]: value } : r));
      };

      const handleUpdateIngredient = (idx, field, value) => {
        setRecipes(prev => prev.map(r => {
          if (r.id === selectedRecipeId) {
            const newIngs = [...r.ingredients];
            newIngs[idx] = { 
              ...newIngs[idx], 
              [field]: field === 'name' || field === 'unit' ? value : Math.max(0, Number(value) || 0) 
            };
            return { ...r, ingredients: newIngs };
          }
          return r;
        }));
      };

        setRecipes(prev => prev.map(r => {
          if (r.id === selectedRecipeId) {
            return { ...r, ingredients: [...r.ingredients, { name: "Novo ingrediente", qty: 1, unit: "unidade", price: 0 }] };

          return r;
        }));

        setRecipes(prev => prev.map(r => {
          if (r.id === selectedRecipeId) {
            return { ...r, ingredients: r.ingredients.filter((_, i) => i !== idx) };

          return r;

        downloadAnchor.setAttribute("href", dataStr);

        downloadAnchor.remove();
      };

        const fileReader = new FileReader();
        if (event.target.files && event.target.files[0]) {

        const map = {};
        recipes.forEach(r => {
          (r.ingredients || []).forEach(ing => {

            if (!map[key]) {

            }
            map[key].qty += Number(ing.qty) || 0;
            map[key].estimatedCost += (Number(ing.qty) || 0) * (Number(ing.price) || 0);

        });
